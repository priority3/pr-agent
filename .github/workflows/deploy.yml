name: deploy

# main 有推送 → 自动部署到服务器。
#
# 机制(2026-10-26 改):rsync 源码到服务器,在服务器上 `docker build` 后重启容器。
#
# 为什么不再「runner 构建镜像 + ssh 传」(原方案,2026-09-07 引入):
#   那条路每一步都没有层复用 —— `docker save` 导出的是完整镜像,服务器 `docker load` 也不认
#   「这几层我已有」。实测镜像 392~445 MB、`gzip -1` 后 149 MB,而这条跨境链路只有 14~31 KB/s,
#   单次部署 1 小时 48 分到 4 小时(2026-10-20 当天三次实测)。
#   而服务器上 `oven/bun:1.3.1`(221 MB)与 `node:24-slim` 本来就在本地,层缓存能直接复用:
#   同一份源码在服务器上构建实测 88 秒(冷)/ 38 秒(依赖层命中)。
#   代价:构建吃服务器 CPU,且要求服务器能装 npm 依赖 —— 见下一条。
#
# 为什么当年反而挪去 runner:服务器拉单个 npm 包没问题(0.6s/200),但几百个包并发会被掐断。
#   现在 Dockerfile 的 `npm ci` 默认走 npmmirror(`--build-arg NPM_REGISTRY` 可覆盖),规避这一点。
#
# 可见性(踩过的坑,别改回去):所有 run 块一律 `set -euo pipefail`。
#   曾用 `docker compose up -d --build 2>&1 | tail -20`,shell 取的是管道最后一个命令的退出码 ——
#   构建失败 workflow 照样绿。admin 那边就因此静默漏上线过一次(源码 rsync 到了、镜像没建出来、
#   容器继续跑旧的)。
#
# 为什么仍然 rsync:服务器的 /root/pr-agent 不是 git 仓库(只有源码副本 + .env + data/),
#   compose 挂载的 ./data 与备份脚本都在那个目录下;现在它同时是构建上下文。
on:
  push:
    branches: [main]
  workflow_dispatch: # 支持手动重新部署(回滚后重放等)

concurrency:
  group: deploy-pr-agent
  cancel-in-progress: false # 部署不可中断:构建/重启半路取消会留下半成品

env:
  # 服务器 compose 里写死 `image: pr-agent:latest` + `pull_policy: never`,构建必须打同一个 tag。
  IMAGE: pr-agent:latest

jobs:
  # 先复用 checks 的内容:构建不过的东西不该上线。
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: 准备 SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # 末尾换行不能少:OpenSSH 私钥缺 trailing newline 会报 error in libcrypto
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 同步源码
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        # 只需传源码:整个仓库 gzip 后约 476 KB,底座与依赖层全部由服务器本地缓存复用。
        # --delete 清掉服务器上已从仓库删除的文件。排除项是「服务器独有、仓库不该覆盖」的:
        #   .env            —— 密钥与部署参数,只存在于服务器
        #   docker-compose.yml —— 服务器版是 host 网络 + 外部卷,与仓库示例不同
        #   data/           —— 运行数据(pr.db、上传的图片等)
        run: |
          set -euo pipefail
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy -p $PORT -o BatchMode=yes" \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'docker-compose.yml' \
            --exclude 'data' \
            --exclude 'node_modules' \
            ./ "$USER@$HOST:/root/pr-agent/"

      - name: 在服务器上构建并启动
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
          IMAGE: ${{ env.IMAGE }}
        # 服务器 compose 没有 build 段(只有 image + pull_policy: never),所以这里用纯
        # `docker build` 打同名 tag;compose 发现镜像 ID 变了会重建容器。
        # 构建失败 = 本步骤非 0 = workflow 红,旧容器继续跑旧镜像(不会半更新)。
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy -p "$PORT" -o BatchMode=yes "$USER@$HOST" "IMAGE=$IMAGE bash -s" <<'REMOTE'
          set -euo pipefail
          cd /root/pr-agent
          start=$(date +%s)
          docker build -t "$IMAGE" .
          echo "构建耗时 $(( $(date +%s) - start ))s"
          docker compose up -d app
          # 只清一周前的悬空镜像,别把回滚用的近期镜像删了。
          docker image prune -f --filter 'until=168h' >/dev/null 2>&1 || true
          REMOTE

      - name: 部署后探活
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        # 容器起来 ≠ 服务可用。除 /api/health 外再验一个管理端点必须回 401 ——
        # 回 404 说明路由没挂上(见 checks.yml 的同款判断)。
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy -p "$PORT" -o BatchMode=yes "$USER@$HOST" 'bash -s' <<'REMOTE'
          for i in $(seq 1 30); do
            sleep 2
            if curl -sf http://127.0.0.1:3040/api/health > /dev/null; then
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3040/api/pr/memories)
              echo "health OK / GET /api/pr/memories → $code"
              [ "$code" = "401" ] && exit 0
              echo "管理端点未正确挂载(期望 401)"; exit 1
            fi
          done
          echo "60s 内未就绪,最后 30 行日志:"
          docker logs --tail 30 pr-agent
          exit 1
          REMOTE
